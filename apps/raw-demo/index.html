<!doctype html>
<html lang="en" data-shiftcharts-theme="rail-dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShiftCharts — raw package preview</title>
<link rel="stylesheet" href="./dist/styles/theme.css" />
<link rel="stylesheet" href="./dist/styles/chart.css" />
<link rel="stylesheet" href="./dist/styles/auto-chart.css" />
<link rel="stylesheet" href="./dist/styles/interaction-overlay.css" />
<style>
  /*
   * Forces the rail-dark palette regardless of the viewer's OS colour-scheme preference.
   * `theme.css` has explicit pin selectors for rail-light/neutral/neutral-light
   * (`[data-shiftcharts-theme='…']` beating its own `@media (prefers-color-scheme: light)`
   * block) but none for rail-dark, so `data-shiftcharts-theme="rail-dark"` on <html> is
   * currently inert — under a light-OS viewer the base :where(:root) dark values lose to
   * that media block and the page silently gets the light palette. Unlayered rules always
   * win over theme.css's @layer'd ones, so re-asserting the same base values here pins the
   * look for this demo without editing the shipped token file. See apps/raw-demo/README.md.
   */
  :root {
    color-scheme: dark;
    --shiftcharts-surface-color: #141618;
    --shiftcharts-surface-text-color: #e2e5e8;
    --shiftcharts-series-1: #b4e4fd;
    --shiftcharts-series-2: #fdcaa6;
    --shiftcharts-series-3: #28d824;
    --shiftcharts-series-4: #bda4fb;
    --shiftcharts-series-5: #1c9d96;
    --shiftcharts-series-6: #fa2017;
  }
  body {
    margin: 0;
    background: var(--shiftcharts-surface-color);
    color: var(--shiftcharts-surface-text-color);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .raw-demo { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }
  .raw-demo__eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; opacity: 0.6; margin: 0 0 8px; }
  .raw-demo__header h1 { font-size: 28px; margin: 0 0 12px; }
  .raw-demo__header p, .raw-demo__section p { opacity: 0.8; max-width: 68ch; }
  .raw-demo__section { margin-top: 48px; }
  .raw-demo__section h2 { font-size: 20px; margin-bottom: 4px; }
  .raw-demo__grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
  .raw-demo__card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 16px; }
  .raw-demo__card h3 { font-size: 13px; margin: 0 0 12px; opacity: 0.75; font-weight: 500; }
  .raw-demo__frame { position: relative; }
  .raw-demo__tweak { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 20px; align-items: flex-start; }
  .raw-demo__controls { display: grid; gap: 12px; min-width: 240px; }
  .raw-demo__controls label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; opacity: 0.85; }
  .raw-demo__controls input, .raw-demo__controls select { font: inherit; }
  .raw-demo__checkbox { flex-direction: row !important; align-items: center; }
  .raw-demo__preview { flex: 1; min-width: 300px; }
  .raw-demo__plan { margin-top: 20px; }
  .raw-demo__plan pre { max-height: 320px; overflow: auto; background: rgba(255, 255, 255, 0.03); padding: 12px; border-radius: 6px; font-size: 12px; }
  .raw-demo__footer { margin-top: 56px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 24px; }
  .raw-demo__footer li { margin-bottom: 8px; opacity: 0.85; }
  code { background: rgba(255, 255, 255, 0.08); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./dist/entry.js"></script>
</body>
</html>
