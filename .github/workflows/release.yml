name: Release

# `main` is the release branch. P0.5 preserved its original initial commit by merging that
# disconnected history into the ShiftCharts development lineage before this workflow was enabled.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # `id-token: write` is the GitHub-side requirement for npm trusted publishing.
  # OIDC provenance (confirmed 2026-08-24 against docs.npmjs.com and the GitHub Changelog GA
  # announcement — see `research/agent-work/claude/CR-E04-publication-current-state.md`). No
  # `NPM_TOKEN` secret is configured or read anywhere in this file, on purpose: trusted
  # publishing's whole point is that a long-lived registry token is not needed. Both conditions
  # npm requires for automatic provenance — a public repository publishing public packages — are
  # already true in the repository (`publishConfig.access: "public"` on every package). The
  # matching trusted-publisher entries still have to be created for `@shiftcharts/*` on npm before
  # the first publish job can exchange the token.
  contents: write
  id-token: write
  pull-requests: write

env:
  TZ: UTC

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # changesets/action needs full history to diff changesets against the base branch.
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # Version comes from `packageManager` in package.json, same as `ci.yml`.

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          # ⚠ Registry URL is required for OIDC trusted publishing even though no token is set
          # here — this is what makes `id-token: write` above actually take effect for the
          # publish step, per npm's trusted-publishing setup docs.
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      # ⚠ Full verification gate before any version bump or publish — the same bar every PR
      # meets in `ci.yml`. A release workflow that skips this and relies on branch protection
      # alone is one force-push away from publishing something that never passed CI.
      - name: Verify
        run: pnpm verify

      # ⚠ **This is the one step in the whole file with a real, live regression risk, not a
      # theoretical one.** `changeset publish` auto-detects the workspace package manager from
      # `pnpm-workspace.yaml` and shells out to `pnpm publish` per package — confirmed by reading
      # `@changesets/cli`'s own `getPublishTool()` — so this repo's actual publish path is
      # `pnpm publish`'s OIDC support, not npm's. `pnpm/pnpm#11513` reports a live OIDC-publish
      # regression, though against pnpm 11, not this repo's pinned `pnpm@10.34.5` — that
      # regression's applicability to the pinned version was not confirmed either way (see
      # `CR-E04`). `pnpm publish --dry-run` and `pnpm -r publish --dry-run` were both run
      # successfully against this exact pinned version (2026-08-26) and packed all 6 packages
      # correctly; the one thing a dry run cannot exercise is the live OIDC token exchange
      # itself, which only a real run of this job can prove. Treat this job's first real
      # execution as that proof, not as a foregone conclusion.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
