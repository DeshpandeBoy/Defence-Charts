packages:
  - 'packages/*'
  - 'apps/*'
  - 'docs'

# Keep the store hard-linked and the tree strict: a package that uses a dependency
# it never declared must fail here, not in a consumer's build. `unbundle: true`
# (30-implementation-plan.md A1) makes an undeclared peer silently inline
# `react/jsx-runtime` into the output, so strictness is load-bearing, not tidiness.
hoistPattern: []
publicHoistPattern: []

# eslint-config-next imports Next's compiled Babel parser at runtime without declaring
# `next`. Under this workspace's strict no-hoist layout, that undeclared edge correctly
# fails instead of leaking through a flat node_modules tree.
packageExtensions:
  'eslint-config-next@*':
    dependencies:
      next: '*'

# ⚠ esbuild's postinstall stays OFF — declared, not merely defaulted. The script exists for
# the legacy download path; esbuild 0.28 resolves its binary from the `@esbuild/<platform>`
# optional dependency, which pnpm installs normally. Verified rather than assumed:
# `pnpm --filter @shiftcharts/playground build` produces a working bundle with the script ignored.
# Declining it keeps one fewer package able to run arbitrary code at install time, which for
# a build-only dependency is the cheap side of the trade.
#
# ⚠ This does NOT silence pnpm's "Ignored build scripts" notice — tested on 10.34.5, with
# this key and with the `allowBuilds` form, including a forced full reinstall. pnpm reports
# the ignore regardless of whether it was requested. The line is here to state the intent
# and to keep `pnpm approve-builds` from quietly flipping it later, not to quiet the console.
#
# ⚠ If a Vite build ever fails with "You installed esbuild for another platform", this is
# the line to revisit — that error is the symptom of this decision being wrong, and it fails
# loudly rather than silently.
ignoredBuiltDependencies:
  - esbuild
